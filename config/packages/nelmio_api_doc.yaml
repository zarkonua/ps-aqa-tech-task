nelmio_api_doc:
    documentation:
        info:
            title: My App
            description: This is an awesome app!
            version: 1.0.0
        components:
            schemas:
                ApiError:
                    type: object
                    required: [error]
                    properties:
                        error: { type: string, example: 'Note not found.' }
                JwtError:
                    type: object
                    required: [code, message]
                    properties:
                        code: { type: integer, example: 401 }
                        message: { type: string, example: 'Expired JWT Token' }
                ValidationError:
                    type: object
                    required: [error, violations]
                    properties:
                        error: { type: string, example: 'Validation failed.' }
                        violations:
                            type: array
                            items:
                                type: object
                                required: [propertyPath, message]
                                properties:
                                    propertyPath: { type: string, example: role }
                                    message: { type: string, example: 'Role must be one of: viewer, editor.' }
                NoteShare:
                    type: object
                    required: [id, note_id, user, role, version, created_at, updated_at]
                    properties:
                        id: { type: string, format: uuid, example: '0b0f6f0e-3c5e-4e63-9f0a-6f2f0d0c1a11' }
                        note_id: { type: string, format: uuid, example: '5f1d7a52-6b53-4d0c-8f0e-2d6b3a9c7e10' }
                        user:
                            type: object
                            required: [id, email]
                            properties:
                                id: { type: string, format: uuid, example: 'f0f04231-8b66-4e5f-9d55-2eead364ea02' }
                                email: { type: string, format: email, example: 'viewer@example.com' }
                        role: { type: string, enum: [viewer, editor], example: viewer }
                        version: { type: integer, minimum: 1, description: 'Incremented on every change; send it back on PATCH to detect concurrent updates.', example: 1 }
                        created_at: { type: string, format: date-time, example: '2026-10-11T09:30:00+00:00' }
                        updated_at: { type: string, format: date-time, example: '2026-10-11T09:30:00+00:00' }
                TaxonomyItemBrief:
                    type: object
                    required: [id, name, color]
                    properties:
                        id: { type: string, format: uuid, example: '0b0f6f0e-3c5e-4e63-9f0a-6f2f0d0c1a11' }
                        name: { type: string, minLength: 1, maxLength: 30, example: 'Work' }
                        color: { type: string, nullable: true, pattern: '^#[0-9a-f]{6}$', example: '#1f77b4' }
                TaxonomyItem:
                    description: A tag or a category.
                    type: object
                    required: [id, name, color, version, created_at, updated_at]
                    properties:
                        id: { type: string, format: uuid, example: '0b0f6f0e-3c5e-4e63-9f0a-6f2f0d0c1a11' }
                        name: { type: string, minLength: 1, maxLength: 30, example: 'Work' }
                        color: { type: string, nullable: true, pattern: '^#[0-9a-f]{6}$', example: '#1f77b4' }
                        version: { type: integer, minimum: 1, description: 'Incremented on every change; send it back on PATCH to detect concurrent updates.', example: 1 }
                        created_at: { type: string, format: date-time, example: '2026-10-11T09:30:00+00:00' }
                        updated_at: { type: string, format: date-time, example: '2026-10-11T09:30:00+00:00' }
                TaxonomyItemList:
                    type: object
                    required: [items, total, page, items_per_page]
                    properties:
                        items:
                            type: array
                            items: { $ref: '#/components/schemas/TaxonomyItem' }
                        total: { type: integer, example: 1 }
                        page: { type: integer, example: 1 }
                        items_per_page: { type: integer, example: 50 }
                TaxonomyItemCreate:
                    type: object
                    required: [name]
                    additionalProperties: false
                    properties:
                        name: { type: string, minLength: 1, maxLength: 30, description: 'Length is counted after trimming.', example: 'Work' }
                        color: { type: string, nullable: true, pattern: '^#[0-9a-fA-F]{6}$', example: '#1f77b4' }
                TaxonomyItemUpdate:
                    type: object
                    additionalProperties: false
                    properties:
                        name: { type: string, minLength: 1, maxLength: 30, example: 'Work' }
                        color: { type: string, nullable: true, pattern: '^#[0-9a-fA-F]{6}$', description: 'null removes the color.', example: '#1f77b4' }
                        version: { type: integer, minimum: 1, example: 1 }
                NoteTaxonomy:
                    type: object
                    required: [note_id, category, tags]
                    properties:
                        note_id: { type: string, format: uuid, example: '5f1d7a52-6b53-4d0c-8f0e-2d6b3a9c7e10' }
                        category:
                            nullable: true
                            allOf:
                                - { $ref: '#/components/schemas/TaxonomyItemBrief' }
                        tags:
                            type: array
                            maxItems: 10
                            items: { $ref: '#/components/schemas/TaxonomyItemBrief' }
                RateLimitError:
                    type: object
                    required: [error, retry_after]
                    properties:
                        error: { type: string, example: 'Too many attempts. Try again later.' }
                        retry_after: { type: integer, description: 'Seconds to wait; also sent as the Retry-After header.', example: 540 }
                Message:
                    type: object
                    required: [message]
                    properties:
                        message: { type: string, example: 'Password updated.' }
                AccountProfile:
                    type: object
                    required: [id, email, pending_email, is_admin]
                    properties:
                        is_admin: { type: boolean, description: 'Whether I may read the full audit feed.', example: false }
                        id: { type: string, format: uuid, example: 'f0f04231-8b66-4e5f-9d55-2eead364ea02' }
                        email: { type: string, format: email, example: 'user@example.com' }
                        pending_email: { type: string, format: email, nullable: true, description: 'New address waiting to be confirmed, if any.', example: 'new@example.com' }
                AccountSettings:
                    type: object
                    required: [timezone]
                    properties:
                        timezone: { type: string, description: 'IANA time zone name.', example: 'Europe/Kyiv' }
                NoteAttachment:
                    type: object
                    required: [id, note_id, filename, mime_type, size, sha256, uploaded_by, created_at, download_url]
                    properties:
                        id: { type: string, format: uuid, example: '7c1e0d3a-2b4f-4d5e-8a9b-0c1d2e3f4a5b' }
                        note_id: { type: string, format: uuid, example: '5f1d7a52-6b53-4d0c-8f0e-2d6b3a9c7e10' }
                        filename: { type: string, description: 'Sanitized name: no path, no control characters, at most 150 characters.', example: 'report.pdf' }
                        mime_type: { type: string, enum: [image/png, image/jpeg, application/pdf, text/plain, text/csv], example: application/pdf }
                        size: { type: integer, description: 'Bytes.', example: 48213 }
                        sha256: { type: string, description: 'Hex SHA-256 of the file.', example: '9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08' }
                        uploaded_by: { type: string, format: uuid, nullable: true, example: 'f0f04231-8b66-4e5f-9d55-2eead364ea02' }
                        created_at: { type: string, format: date-time, example: '2026-10-11T09:30:00+00:00' }
                        download_url: { type: string, example: '/api/attachments/7c1e0d3a-2b4f-4d5e-8a9b-0c1d2e3f4a5b/download' }
                NoteRevisionSummary:
                    type: object
                    required: [revision, kind, restored_from, title, actor, created_at]
                    properties:
                        revision: { type: integer, minimum: 1, example: 3 }
                        kind: { type: string, enum: [create, update, restore], example: update }
                        restored_from: { type: integer, nullable: true, description: 'For a restore: the revision whose text was brought back.', example: null }
                        title: { type: string, example: 'Meeting notes' }
                        actor:
                            type: object
                            nullable: true
                            description: Who saved this revision.
                            required: [id, email]
                            properties:
                                id: { type: string, format: uuid }
                                email: { type: string, format: email, nullable: true, description: 'null when the account no longer exists.' }
                        created_at: { type: string, format: date-time, example: '2026-10-11T09:30:00+00:00' }
                NoteRevision:
                    allOf:
                        - { $ref: '#/components/schemas/NoteRevisionSummary' }
                        - type: object
                          required: [content]
                          properties:
                              content: { type: string, example: 'Agenda: …' }
                TaskPerson:
                    type: object
                    required: [id, email]
                    properties:
                        id: { type: string, format: uuid, example: 'f0f04231-8b66-4e5f-9d55-2eead364ea02' }
                        email: { type: string, format: email, example: 'user@example.com' }
                TaskWrite:
                    type: object
                    additionalProperties: false
                    description: 'On create, "title" is required. On update, send only what changes, plus optionally "version".'
                    properties:
                        title: { type: string, minLength: 1, maxLength: 150, example: 'Prepare release notes' }
                        description: { type: string, maxLength: 5000, example: 'Collect changes since 1.4.' }
                        priority: { type: string, enum: [low, medium, high], default: medium }
                        due_at: { type: string, format: date-time, nullable: true, description: 'ISO 8601 with a time zone; stored and returned in UTC.', example: '2026-10-20T15:00:00+03:00' }
                        assignee_id: { type: string, format: uuid, nullable: true, description: 'Me or one of my collaborators (see GET /api/tasks/assignees).' }
                        note_id: { type: string, format: uuid, nullable: true, description: 'A note I can see.' }
                        version: { type: integer, minimum: 1, description: 'Update only: version last read; 409 if stale.' }
                Task:
                    type: object
                    required: [id, title, description, status, priority, due_at, position, version, role, owner, assignee, note, allowed_statuses, created_at, updated_at]
                    properties:
                        id: { type: string, format: uuid, example: '3d2c1b0a-9f8e-4d7c-8b6a-5f4e3d2c1b0a' }
                        title: { type: string, example: 'Prepare release notes' }
                        description: { type: string, example: 'Collect changes since 1.4.' }
                        status: { type: string, enum: [backlog, todo, in_progress, done], example: todo }
                        priority: { type: string, enum: [low, medium, high], example: high }
                        due_at: { type: string, format: date-time, nullable: true, example: '2026-10-20T12:00:00+00:00' }
                        position: { type: integer, description: 'Order inside its status column on the owner''s board, from 0.', example: 0 }
                        version: { type: integer, minimum: 1, example: 3 }
                        role: { type: string, enum: [owner, assignee], description: 'What the caller is for this task.', example: owner }
                        owner: { $ref: '#/components/schemas/TaskPerson' }
                        assignee:
                            nullable: true
                            allOf:
                                - { $ref: '#/components/schemas/TaskPerson' }
                        note:
                            type: object
                            nullable: true
                            description: 'Linked note; null when there is none or the caller cannot see it.'
                            required: [id, title]
                            properties:
                                id: { type: string, format: uuid }
                                title: { type: string }
                        allowed_statuses: { type: array, items: { type: string }, description: 'Statuses the task may move to from here.', example: [backlog, in_progress] }
                        created_at: { type: string, format: date-time, example: '2026-10-11T09:30:00+00:00' }
                        updated_at: { type: string, format: date-time, example: '2026-10-11T09:30:00+00:00' }
                Notification:
                    type: object
                    required: [id, type, message, actor, resource, link, created_at, read_at]
                    properties:
                        id: { type: string, format: uuid, example: '8a7b6c5d-4e3f-4a2b-9c1d-0e9f8a7b6c5d' }
                        type: { type: string, enum: [share_granted, share_revoked, task_assigned, task_due, task_completed], example: share_granted }
                        message: { type: string, example: 'owner@example.com shared a note with you: "Release plan".' }
                        actor:
                            type: object
                            nullable: true
                            description: 'Who caused it; null for "task_due".'
                            required: [id, email]
                            properties:
                                id: { type: string, format: uuid }
                                email: { type: string, format: email, nullable: true, description: 'null when the account no longer exists.' }
                        resource:
                            type: object
                            required: [type, id, title, available]
                            properties:
                                type: { type: string, enum: [note, task], example: note }
                                id: { type: string, format: uuid }
                                title: { type: string, nullable: true, description: 'null when I can no longer see the note or task, and always for "share_revoked".', example: 'Release plan' }
                                available: { type: boolean, description: 'Whether I can still open it.', example: true }
                        link: { type: string, nullable: true, description: 'Page of the app where it can be found; null when it is not available.', example: '/account/shared' }
                        created_at: { type: string, format: date-time, example: '2026-10-11T09:30:00+00:00' }
                        read_at: { type: string, format: date-time, nullable: true, example: null }
                NotificationPreferences:
                    type: object
                    required: [email]
                    properties:
                        email:
                            type: object
                            description: 'Notification type → whether it is also sent by email. Default: true for all.'
                            additionalProperties: false
                            properties:
                                share_granted: { type: boolean, example: true }
                                share_revoked: { type: boolean, example: true }
                                task_assigned: { type: boolean, example: false }
                                task_due: { type: boolean, example: true }
                                task_completed: { type: boolean, example: true }
                AuditEvent:
                    type: object
                    required: [id, type, actor, target_user, note_id, subject_id, details, correlation_id, created_at]
                    properties:
                        id: { type: string, format: uuid }
                        type: { type: string, description: 'What happened, as "<area>.<action>".', example: 'share.granted' }
                        actor:
                            type: object
                            nullable: true
                            description: Who did it.
                            required: [id, email]
                            properties:
                                id: { type: string, format: uuid }
                                email: { type: string, format: email, nullable: true, description: 'null when the account no longer exists.' }
                        target_user:
                            type: object
                            nullable: true
                            description: 'The user it was done to, e.g. who a note was shared with.'
                            required: [id, email]
                            properties:
                                id: { type: string, format: uuid }
                                email: { type: string, format: email, nullable: true }
                        note_id: { type: string, format: uuid, nullable: true }
                        subject_id: { type: string, format: uuid, nullable: true, description: 'ID of the share, tag, category, attachment or task concerned.' }
                        details: { type: object, description: 'Summary of the change: field names, lengths, roles, statuses. Never the changed text, and never credentials.', example: { changed: [content], content: { length_before: 120, length_after: 164 }, version: 3 } }
                        correlation_id: { type: string, nullable: true, description: 'X-Correlation-ID of the request that caused it.', example: 'c2a4b2c4-6f0e-4b53-9f0a-2d6b3a9c7e10' }
                        created_at: { type: string, format: date-time, example: '2026-10-11T09:30:00+00:00' }
                AuditEventPage:
                    type: object
                    required: [items, next_cursor, limit]
                    properties:
                        items:
                            type: array
                            items: { $ref: '#/components/schemas/AuditEvent' }
                        next_cursor: { type: string, nullable: true, description: 'Send as "cursor" to get the next (older) page; null on the last page.', example: 'MTc5MTgwMDAwMHw4YTdiNmM1ZC00ZTNmLTRhMmItOWMxZC0wZTlmOGE3YjZjNWQ' }
                        limit: { type: integer, example: 20 }
                RealtimeEvent:
                    type: object
                    required: [id, type, data, created_at]
                    properties:
                        id: { type: string, description: 'Opaque ID; pass the last one back to continue.', example: '5c3d0a51f1e94b0b9d2a7e6c4f8b1a20' }
                        type: { type: string, enum: [note.updated, note.deleted, share.revoked, presence.joined, presence.left], example: note.updated }
                        data: { type: object, description: 'note.updated: "version" and "actor". presence.*: "user". Never note text.', example: { version: 4, actor: { id: '1525…', email: 'editor@example.com' } } }
                        created_at: { type: string, format: date-time, example: '2026-10-11T09:30:00+00:00' }
                RealtimePoll:
                    type: object
                    required: [note_id, version, resync, events, last_event_id, presence]
                    properties:
                        note_id: { type: string, format: uuid }
                        version: { type: integer, description: 'Current version of the note.', example: 4 }
                        resync: { type: boolean, description: 'true when "after" is unknown or too old: reload the note instead of relying on "events".', example: false }
                        events:
                            type: array
                            items: { $ref: '#/components/schemas/RealtimeEvent' }
                        last_event_id: { type: string, nullable: true, description: 'Send as "after" next time.', example: '5c3d0a51f1e94b0b9d2a7e6c4f8b1a20' }
                        presence:
                            type: array
                            description: 'Who has the note open, including the caller.'
                            items: { $ref: '#/components/schemas/TaskPerson' }
                NoteImportRequest:
                    type: object
                    required: [file]
                    properties:
                        file: { type: string, format: binary, description: 'CSV (header row with at least title and content; optional external_id, tags, category, created_at, updated_at) or a JSON export.' }
                        mode: { type: string, enum: [atomic, partial], default: atomic }
                        duplicates: { type: string, enum: [reject, skip, upsert], default: reject }
                        format: { type: string, enum: [csv, json], description: 'Only needed when the file name does not end in .csv or .json.' }
                NoteImportError:
                    type: object
                    required: [line, field, message]
                    properties:
                        line: { type: integer, description: 'CSV: line of the file the row starts on (the header is line 1). JSON: position in "notes", from 1.', example: 4 }
                        field: { type: string, description: 'Column concerned; empty when the whole row is unusable.', example: title }
                        message: { type: string, example: 'Title is required.' }
                NoteImportPreview:
                    type: object
                    required: [format, mode, duplicates, total_rows, valid_rows, invalid_rows, create, update, skip, importable, errors, preview]
                    properties:
                        format: { type: string, enum: [csv, json] }
                        mode: { type: string, enum: [atomic, partial] }
                        duplicates: { type: string, enum: [reject, skip, upsert] }
                        total_rows: { type: integer, example: 3 }
                        valid_rows: { type: integer, example: 2 }
                        invalid_rows: { type: integer, example: 1 }
                        create: { type: integer, description: 'Rows that would become new notes.', example: 2 }
                        update: { type: integer, description: 'Rows that would update a note of mine with the same external_id.', example: 0 }
                        skip: { type: integer, description: 'Rows that would be left out because I already have that external_id.', example: 0 }
                        importable: { type: boolean, description: 'Whether the import route would accept this file with these options.', example: false }
                        errors: { type: array, description: 'At most 200.', items: { $ref: '#/components/schemas/NoteImportError' } }
                        preview:
                            type: array
                            description: 'The first 20 valid rows as they would be imported.'
                            items:
                                type: object
                                properties:
                                    line: { type: integer }
                                    action: { type: string, enum: [create, update, skip] }
                                    external_id: { type: string, nullable: true }
                                    title: { type: string }
                                    content_length: { type: integer }
                                    tags: { type: array, items: { type: string } }
                                    category: { type: string, nullable: true }
                NoteImportResult:
                    type: object
                    required: [format, mode, duplicates, total_rows, valid_rows, invalid_rows, create, update, skip, importable, errors, notes, imported]
                    properties:
                        total_rows: { type: integer, example: 3 }
                        create: { type: integer, example: 2 }
                        update: { type: integer, example: 0 }
                        skip: { type: integer, example: 0 }
                        invalid_rows: { type: integer, example: 1 }
                        errors: { type: array, items: { $ref: '#/components/schemas/NoteImportError' } }
                        imported: { type: boolean, example: true }
                        notes:
                            type: array
                            items:
                                type: object
                                properties:
                                    line: { type: integer, example: 2 }
                                    action: { type: string, enum: [created, updated, skipped] }
                                    id: { type: string, format: uuid }
                NoteExport:
                    type: object
                    required: [schema, schema_version, exported_at, count, notes]
                    properties:
                        schema: { type: string, enum: [notes-export] }
                        schema_version: { type: integer, enum: [1] }
                        exported_at: { type: string, format: date-time, example: '2026-10-12T10:00:00+00:00' }
                        count: { type: integer, example: 1 }
                        notes:
                            type: array
                            items:
                                type: object
                                required: [external_id, title, content, tags, category, created_at, updated_at]
                                properties:
                                    external_id: { type: string, nullable: true, example: 'a-1' }
                                    title: { type: string, example: 'Plan' }
                                    content: { type: string, example: 'Text' }
                                    tags: { type: array, items: { type: string }, example: [idea, work] }
                                    category: { type: string, nullable: true, example: 'Projects' }
                                    created_at: { type: string, format: date-time }
                                    updated_at: { type: string, format: date-time }
                NoteShareList:
                    type: object
                    required: [items, total, page, items_per_page]
                    properties:
                        items:
                            type: array
                            items: { $ref: '#/components/schemas/NoteShare' }
                        total: { type: integer, example: 1 }
                        page: { type: integer, example: 1 }
                        items_per_page: { type: integer, example: 50 }
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
