nelmio_api_doc:
    documentation:
        info:
            title: My App
            description: This is an awesome app!
            version: 1.0.0
        components:
            schemas:
                ApiError:
                    type: object
                    required: [error]
                    properties:
                        error: { type: string, example: 'Note not found.' }
                JwtError:
                    type: object
                    required: [code, message]
                    properties:
                        code: { type: integer, example: 401 }
                        message: { type: string, example: 'Expired JWT Token' }
                ValidationError:
                    type: object
                    required: [error, violations]
                    properties:
                        error: { type: string, example: 'Validation failed.' }
                        violations:
                            type: array
                            items:
                                type: object
                                required: [propertyPath, message]
                                properties:
                                    propertyPath: { type: string, example: role }
                                    message: { type: string, example: 'Role must be one of: viewer, editor.' }
                NoteShare:
                    type: object
                    required: [id, note_id, user, role, version, created_at, updated_at]
                    properties:
                        id: { type: string, format: uuid, example: '0b0f6f0e-3c5e-4e63-9f0a-6f2f0d0c1a11' }
                        note_id: { type: string, format: uuid, example: '5f1d7a52-6b53-4d0c-8f0e-2d6b3a9c7e10' }
                        user:
                            type: object
                            required: [id, email]
                            properties:
                                id: { type: string, format: uuid, example: 'f0f04231-8b66-4e5f-9d55-2eead364ea02' }
                                email: { type: string, format: email, example: 'viewer@example.com' }
                        role: { type: string, enum: [viewer, editor], example: viewer }
                        version: { type: integer, minimum: 1, description: 'Incremented on every change; send it back on PATCH to detect concurrent updates.', example: 1 }
                        created_at: { type: string, format: date-time, example: '2026-10-11T09:30:00+00:00' }
                        updated_at: { type: string, format: date-time, example: '2026-10-11T09:30:00+00:00' }
                TaxonomyItemBrief:
                    type: object
                    required: [id, name, color]
                    properties:
                        id: { type: string, format: uuid, example: '0b0f6f0e-3c5e-4e63-9f0a-6f2f0d0c1a11' }
                        name: { type: string, minLength: 1, maxLength: 30, example: 'Work' }
                        color: { type: string, nullable: true, pattern: '^#[0-9a-f]{6}$', example: '#1f77b4' }
                TaxonomyItem:
                    description: A tag or a category.
                    type: object
                    required: [id, name, color, version, created_at, updated_at]
                    properties:
                        id: { type: string, format: uuid, example: '0b0f6f0e-3c5e-4e63-9f0a-6f2f0d0c1a11' }
                        name: { type: string, minLength: 1, maxLength: 30, example: 'Work' }
                        color: { type: string, nullable: true, pattern: '^#[0-9a-f]{6}$', example: '#1f77b4' }
                        version: { type: integer, minimum: 1, description: 'Incremented on every change; send it back on PATCH to detect concurrent updates.', example: 1 }
                        created_at: { type: string, format: date-time, example: '2026-10-11T09:30:00+00:00' }
                        updated_at: { type: string, format: date-time, example: '2026-10-11T09:30:00+00:00' }
                TaxonomyItemList:
                    type: object
                    required: [items, total, page, items_per_page]
                    properties:
                        items:
                            type: array
                            items: { $ref: '#/components/schemas/TaxonomyItem' }
                        total: { type: integer, example: 1 }
                        page: { type: integer, example: 1 }
                        items_per_page: { type: integer, example: 50 }
                TaxonomyItemCreate:
                    type: object
                    required: [name]
                    additionalProperties: false
                    properties:
                        name: { type: string, minLength: 1, maxLength: 30, description: 'Length is counted after trimming.', example: 'Work' }
                        color: { type: string, nullable: true, pattern: '^#[0-9a-fA-F]{6}$', example: '#1f77b4' }
                TaxonomyItemUpdate:
                    type: object
                    additionalProperties: false
                    properties:
                        name: { type: string, minLength: 1, maxLength: 30, example: 'Work' }
                        color: { type: string, nullable: true, pattern: '^#[0-9a-fA-F]{6}$', description: 'null removes the color.', example: '#1f77b4' }
                        version: { type: integer, minimum: 1, example: 1 }
                NoteTaxonomy:
                    type: object
                    required: [note_id, category, tags]
                    properties:
                        note_id: { type: string, format: uuid, example: '5f1d7a52-6b53-4d0c-8f0e-2d6b3a9c7e10' }
                        category:
                            nullable: true
                            allOf:
                                - { $ref: '#/components/schemas/TaxonomyItemBrief' }
                        tags:
                            type: array
                            maxItems: 10
                            items: { $ref: '#/components/schemas/TaxonomyItemBrief' }
                RateLimitError:
                    type: object
                    required: [error, retry_after]
                    properties:
                        error: { type: string, example: 'Too many attempts. Try again later.' }
                        retry_after: { type: integer, description: 'Seconds to wait; also sent as the Retry-After header.', example: 540 }
                Message:
                    type: object
                    required: [message]
                    properties:
                        message: { type: string, example: 'Password updated.' }
                AccountProfile:
                    type: object
                    required: [id, email, pending_email]
                    properties:
                        id: { type: string, format: uuid, example: 'f0f04231-8b66-4e5f-9d55-2eead364ea02' }
                        email: { type: string, format: email, example: 'user@example.com' }
                        pending_email: { type: string, format: email, nullable: true, description: 'New address waiting to be confirmed, if any.', example: 'new@example.com' }
                AccountSettings:
                    type: object
                    required: [timezone]
                    properties:
                        timezone: { type: string, description: 'IANA time zone name.', example: 'Europe/Kyiv' }
                NoteAttachment:
                    type: object
                    required: [id, note_id, filename, mime_type, size, sha256, uploaded_by, created_at, download_url]
                    properties:
                        id: { type: string, format: uuid, example: '7c1e0d3a-2b4f-4d5e-8a9b-0c1d2e3f4a5b' }
                        note_id: { type: string, format: uuid, example: '5f1d7a52-6b53-4d0c-8f0e-2d6b3a9c7e10' }
                        filename: { type: string, description: 'Sanitized name: no path, no control characters, at most 150 characters.', example: 'report.pdf' }
                        mime_type: { type: string, enum: [image/png, image/jpeg, application/pdf, text/plain, text/csv], example: application/pdf }
                        size: { type: integer, description: 'Bytes.', example: 48213 }
                        sha256: { type: string, description: 'Hex SHA-256 of the file.', example: '9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08' }
                        uploaded_by: { type: string, format: uuid, nullable: true, example: 'f0f04231-8b66-4e5f-9d55-2eead364ea02' }
                        created_at: { type: string, format: date-time, example: '2026-10-11T09:30:00+00:00' }
                        download_url: { type: string, example: '/api/attachments/7c1e0d3a-2b4f-4d5e-8a9b-0c1d2e3f4a5b/download' }
                NoteRevisionSummary:
                    type: object
                    required: [revision, kind, restored_from, title, actor, created_at]
                    properties:
                        revision: { type: integer, minimum: 1, example: 3 }
                        kind: { type: string, enum: [create, update, restore], example: update }
                        restored_from: { type: integer, nullable: true, description: 'For a restore: the revision whose text was brought back.', example: null }
                        title: { type: string, example: 'Meeting notes' }
                        actor:
                            type: object
                            nullable: true
                            description: Who saved this revision.
                            required: [id, email]
                            properties:
                                id: { type: string, format: uuid }
                                email: { type: string, format: email, nullable: true, description: 'null when the account no longer exists.' }
                        created_at: { type: string, format: date-time, example: '2026-10-11T09:30:00+00:00' }
                NoteRevision:
                    allOf:
                        - { $ref: '#/components/schemas/NoteRevisionSummary' }
                        - type: object
                          required: [content]
                          properties:
                              content: { type: string, example: 'Agenda: …' }
                NoteShareList:
                    type: object
                    required: [items, total, page, items_per_page]
                    properties:
                        items:
                            type: array
                            items: { $ref: '#/components/schemas/NoteShare' }
                        total: { type: integer, example: 1 }
                        page: { type: integer, example: 1 }
                        items_per_page: { type: integer, example: 50 }
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
